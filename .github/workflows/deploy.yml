# GitHub Actions 워크플로의 이름입니다.
# GitHub 저장소의 Actions 탭에서 이 이름으로 보입니다.
name: Deploy portfolio to GitHub Pages

# 이 워크플로가 언제 실행될지 정합니다.
on:
  # main 브랜치에 코드가 올라갈 때마다 자동으로 실행합니다.
  push:
    branches: ['main']
  # GitHub Actions 화면에서 사람이 직접 실행할 수 있게 합니다.
  workflow_dispatch:

# GitHub Actions가 이 작업을 할 때 필요한 권한입니다.
permissions:
  # 저장소 코드를 읽을 수 있는 권한입니다.
  contents: read
  # GitHub Pages에 배포할 수 있는 권한입니다.
  pages: write
  # GitHub가 배포 요청을 안전하게 확인할 때 쓰는 권한입니다.
  id-token: write

# 같은 Pages 배포 작업이 동시에 여러 번 겹치지 않도록 제어합니다.
concurrency:
  # 같은 그룹 이름을 가진 작업끼리는 하나의 배포 흐름으로 취급합니다.
  group: 'pages'
  # 새 배포가 시작되면 아직 끝나지 않은 이전 배포는 취소합니다.
  cancel-in-progress: true

# 실제로 실행할 작업들의 묶음입니다.
jobs:
  # deploy라는 이름의 작업 하나를 정의합니다.
  deploy:
    # 이 작업이 GitHub Pages 환경에 배포된다는 뜻입니다.
    environment:
      name: github-pages
      # 배포가 끝난 뒤 만들어진 사이트 주소를 GitHub 화면에 보여줍니다.
      url: ${{ steps.deployment.outputs.page_url }}
    # GitHub가 제공하는 최신 Ubuntu 가상 컴퓨터에서 작업을 실행합니다.
    runs-on: ubuntu-latest
    steps:
      # 1. 저장소 코드를 가상 컴퓨터로 내려받습니다.
      - name: Checkout
        uses: actions/checkout@v6

      # 2. 프로젝트를 빌드할 수 있도록 Node.js를 설치합니다.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # 현재 장기 지원 버전의 Node.js를 사용합니다.
          node-version: lts/*

      # 3. package-lock.json 기준으로 필요한 패키지를 정확히 설치합니다.
      - name: Install dependencies
        run: npm ci

      # 4. 실제 웹사이트 파일을 만듭니다.
      - name: Build
        run: npm run build
        env:
          # GitHub 저장소 변수에 등록된 Google Analytics 측정 ID를 빌드에 전달합니다.
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      # 5. GitHub Pages 배포에 필요한 기본 설정을 준비합니다.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. 빌드 결과물인 dist 폴더를 GitHub Pages에 올릴 배포 파일로 묶습니다.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      # 7. 위에서 올린 배포 파일을 GitHub Pages에 실제로 배포합니다.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
