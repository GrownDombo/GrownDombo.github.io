<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shortcut response optimization diagram</title>
  <desc id="desc">Comparison of a slow shortcut lookup flow and a faster two-key dictionary lookup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.52" stop-color="#172033"/>
      <stop offset="1" stop-color="#203A43"/>
    </linearGradient>
    <linearGradient id="after" x1="682" y1="150" x2="1110" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="before" x1="85" y1="145" x2="510" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <rect x="44" y="42" width="1112" height="676" rx="28" fill="#F8FAFC" fill-opacity="0.05" stroke="#E2E8F0" stroke-opacity="0.16"/>

  <text x="80" y="105" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">Shortcut Response Optimization</text>
  <text x="82" y="142" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="19">Sequential lookup flow to Two-Key Dictionary lookup</text>

  <g filter="url(#shadow)">
    <rect x="78" y="188" width="462" height="440" rx="22" fill="#111827" stroke="#F97316" stroke-opacity="0.55"/>
    <rect x="105" y="218" width="130" height="34" rx="17" fill="url(#before)"/>
    <text x="128" y="241" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">BEFORE</text>
    <text x="105" y="296" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Sequential lookup</text>
    <text x="106" y="328" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">Search target on every key input</text>

    <g transform="translate(105 370)">
      <rect width="382" height="58" rx="14" fill="#1F2937" stroke="#334155"/>
      <text x="24" y="36" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Key event</text>
      <path d="M321 29H358" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <path d="M349 18L360 29L349 40" stroke="#F97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(105 446)">
      <rect width="382" height="58" rx="14" fill="#1F2937" stroke="#334155"/>
      <text x="24" y="36" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Search list by user, screen, key</text>
      <path d="M321 29H358" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
      <path d="M349 18L360 29L349 40" stroke="#F97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(105 522)">
      <rect width="382" height="58" rx="14" fill="#1F2937" stroke="#334155"/>
      <text x="24" y="36" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Run matched control</text>
    </g>
    <rect x="105" y="656" width="190" height="54" rx="16" fill="#451A03" stroke="#FB923C"/>
    <text x="124" y="679" fill="#FED7AA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Debug log</text>
    <text x="124" y="700" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="900">~2s</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="188" width="462" height="440" rx="22" fill="#0B1220" stroke="#22C55E" stroke-opacity="0.62"/>
    <rect x="687" y="218" width="112" height="34" rx="17" fill="url(#after)"/>
    <text x="716" y="241" fill="#ECFEFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">AFTER</text>
    <text x="687" y="296" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">Two-Key Dictionary</text>
    <text x="688" y="328" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="17">Immediate modifier + key lookup</text>

    <g transform="translate(687 370)">
      <rect width="382" height="58" rx="14" fill="#102A2B" stroke="#1D4ED8" stroke-opacity="0.35"/>
      <text x="24" y="36" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Load and save shortcut XML</text>
      <path d="M321 29H358" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
      <path d="M349 18L360 29L349 40" stroke="#22C55E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(687 446)">
      <rect width="382" height="58" rx="14" fill="#102A2B" stroke="#1D4ED8" stroke-opacity="0.35"/>
      <text x="24" y="36" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Map modifier + key code</text>
      <path d="M321 29H358" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
      <path d="M349 18L360 29L349 40" stroke="#22C55E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(687 522)">
      <rect width="382" height="58" rx="14" fill="#102A2B" stroke="#1D4ED8" stroke-opacity="0.35"/>
      <text x="24" y="36" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Immediate action lookup</text>
    </g>
    <rect x="687" y="656" width="190" height="54" rx="16" fill="#052E16" stroke="#22C55E"/>
    <text x="706" y="679" fill="#BBF7D0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Debug log</text>
    <text x="706" y="700" fill="#DCFCE7" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="900">0.3s</text>
  </g>

  <g transform="translate(548 372)">
    <circle cx="52" cy="52" r="44" fill="#F8FAFC" fill-opacity="0.1" stroke="#E2E8F0" stroke-opacity="0.2"/>
    <path d="M35 52H69" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/>
    <path d="M58 38L72 52L58 66" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(934 83)">
    <rect width="172" height="70" rx="18" fill="#F8FAFC" fill-opacity="0.1" stroke="#E2E8F0" stroke-opacity="0.18"/>
    <text x="21" y="29" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">UX result</text>
    <text x="21" y="54" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="900">Stable input</text>
  </g>
</svg>
