<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Remote shared-folder I/O bottleneck improvement</title>
  <desc id="desc">A public portfolio diagram showing SMB shared-folder direct I/O replaced by TCP/IP batch execution delegation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf3ff"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="652" rx="26" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="90" y="118" fill="#0f172a" font-size="38" font-weight="800">Remote I/O Bottleneck</text>
    <text x="90" y="156" fill="#475569" font-size="20" font-weight="650">Remote direct file handling replaced with local batch execution</text>

    <g transform="translate(90 210)">
      <rect width="450" height="250" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
      <text x="28" y="48" fill="#c2410c" font-size="17" font-weight="800">BEFORE</text>
      <text x="28" y="88" fill="#0f172a" font-size="28" font-weight="800">Remote PC handles files</text>
      <text x="28" y="124" fill="#475569" font-size="18" font-weight="650">SMB round trips accumulate during Confirm</text>

      <rect x="28" y="164" width="116" height="48" rx="12" fill="#ffffff" stroke="#fed7aa"/>
      <text x="86" y="194" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">Remote PC</text>
      <path d="M156 188h42" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
      <path d="M190 178l12 10-12 10" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="216" y="164" width="116" height="48" rx="12" fill="#ffffff" stroke="#fed7aa"/>
      <text x="274" y="194" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">SMB Share</text>
      <path d="M344 188h42" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
      <path d="M378 178l12 10-12 10" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="404" y="164" width="94" height="48" rx="12" fill="#ffffff" stroke="#fed7aa"/>
      <text x="451" y="194" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">Move</text>
    </g>

    <g transform="translate(574 250)">
      <rect width="150" height="172" rx="22" fill="url(#blueCard)" filter="url(#shadow)"/>
      <path d="M75 40l32 18v36l-32 18-32-18V58z" fill="none" stroke="#dbeafe" stroke-width="5" stroke-linejoin="round"/>
      <path d="M43 58l32 18 32-18M75 76v36" fill="none" stroke="#dbeafe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="75" y="134" text-anchor="middle" fill="#eff6ff" font-size="15" font-weight="800">Batch Exec</text>
      <text x="75" y="156" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">TCP/IP request only</text>
    </g>

    <path d="M536 336h38" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <path d="M568 324l16 12-16 12" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M724 336h38" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <path d="M756 324l16 12-16 12" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(760 210)">
      <rect width="350" height="250" rx="20" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
      <text x="28" y="48" fill="#0f766e" font-size="17" font-weight="800">AFTER</text>
      <text x="28" y="88" fill="#0f172a" font-size="28" font-weight="800">Local PC moves files</text>
      <text x="28" y="124" fill="#475569" font-size="18" font-weight="650">Shared path is replaced with local path</text>

      <rect x="28" y="164" width="116" height="48" rx="12" fill="#ffffff" stroke="#99f6e4"/>
      <text x="86" y="194" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">TCP/IP</text>
      <path d="M156 188h42" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
      <path d="M190 178l12 10-12 10" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="216" y="164" width="116" height="48" rx="12" fill="#ffffff" stroke="#99f6e4"/>
      <text x="274" y="194" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">Local Move</text>
    </g>

    <g transform="translate(90 538)">
      <rect width="314" height="92" rx="18" fill="url(#darkCard)"/>
      <text x="28" y="38" fill="#93c5fd" font-size="16" font-weight="800">CONFIRM TOTAL</text>
      <text x="28" y="70" fill="#ffffff" font-size="28" font-weight="850">90% reduction</text>
    </g>
    <g transform="translate(430 538)">
      <rect width="314" height="92" rx="18" fill="url(#darkCard)"/>
      <text x="28" y="38" fill="#93c5fd" font-size="16" font-weight="800">NETWORK PAYLOAD</text>
      <text x="28" y="70" fill="#ffffff" font-size="28" font-weight="850">Batch request only</text>
    </g>
    <g transform="translate(770 538)">
      <rect width="314" height="92" rx="18" fill="url(#darkCard)"/>
      <text x="28" y="38" fill="#93c5fd" font-size="16" font-weight="800">FALLBACK</text>
      <text x="28" y="70" fill="#ffffff" font-size="28" font-weight="850">Original flow kept</text>
    </g>
  </g>
</svg>
